name: movie_memory
description: "MovieMemory - Plataforma para descubrir, organizar y disfrutar contenido multimedia"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.2
  firebase_messaging: ^15.1.3

  # Google Sign In
  google_sign_in: ^6.2.1

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # HTTP Client
  dio: ^5.7.0
  http: ^1.2.1

  # Cache local
  hive_flutter: ^1.1.0

  # Imagenes
  cached_network_image: ^3.4.1

  # Navegacion
  go_router: ^14.2.7

  # Variables de entorno
  flutter_dotenv: ^5.2.1

  # Notificaciones locales
  flutter_local_notifications: ^17.2.3

  # Audio
  audioplayers: ^6.1.0

  # UI
  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.2
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.10.0

  # Localization
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # Sharing
  share_plus: ^10.0.3

  # Local storage
  shared_preferences: ^2.3.3
  better_player:
    path: patched_packages/better_player
  image_picker: ^1.2.2
  image_cropper: ^12.2.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  riverpod_generator: ^2.4.3
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  image_path: "logo/Logo_MovieMemoryApp.png"

flutter:
  generate: true
  uses-material-design: true
  assets:
    - .env
    - logo/
    - sound/open_app.wav
    - sound/click_sound.mp3
    - sound/add_sound.wav
    - sound/confirm_sound.wav
    - sound/remove_sound.wav
    - sound/error_sound.flac
    - sound/notification_sound.wav